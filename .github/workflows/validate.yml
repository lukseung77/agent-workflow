name: Validate workflow

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-openspec-${{ runner.os }}-node22-1.3.1
      - name: Install validation CLI
        run: npm install --global @fission-ai/openspec@1.3.1
      - name: Run repository validation
        run: python3 scripts/validate.py --require-openspec
